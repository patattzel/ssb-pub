name: Verify and publish

on:
  push:
    branches: ['main']
    tags: ['cloudron-v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Build and check the Cloudron container
        run: |
          docker build --platform linux/amd64 -t ssb-pub:test .
          sh test/container.sh ssb-pub:test

  publish:
    if: startsWith(github.ref, 'refs/tags/cloudron-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish Cloudron image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -er .version CloudronManifest.json)
          test "$GITHUB_REF_NAME" = "cloudron-v${version}"
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo}:${version}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$image" .
          docker push "$image"
